name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      # Throwaway values so the app can start on a clean runner.
      # Real secrets live in User Secrets locally and are never committed.
      Jwt__Secret: ci-only-signing-key-not-a-real-secret-at-least-32-chars
      Jwt__Issuer: ResearchHub
      Jwt__Audience: ResearchHubClient
      Jwt__AccessTokenExpiryMinutes: "30"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal